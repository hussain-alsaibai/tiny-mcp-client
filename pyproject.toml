[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-mcp-client"
version = "0.1.0"
description = "Zero-dependency Model Context Protocol client for Python. Connects to any MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "llm", "ai-agent", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
